services:
  mergemind:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MERGEMIND_DATABASE_PATH: /app/data/mergemind.sqlite3
      MERGEMIND_LLM_BASE_URL: http://host.docker.internal:11434/v1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - mergemind-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  mergemind-data:
